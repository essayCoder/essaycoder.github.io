<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reclaim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9F5EF;--surface:#FFFFFF;--surface-2:#F4EEE4;--text:#2C1810;--text-2:#7A6A5A;
  --line:#E6DED2;--brand:#C4694A;--brand-soft:#FBEDE6;--brand-on:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1F1915;--surface:#2A221C;--surface-2:#352C24;--text:#F6F0E8;--text-2:#B5A695;
        --line:#44392F;--brand:#E08D6C;--brand-soft:#3A2A22;--brand-on:#1F1915;}
}
body{background:var(--bg);color:var(--text);
  font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans KR","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.mark{width:22px;height:22px;border-radius:7px;background:var(--brand);flex:none}
.bname{white-space:nowrap}
.bname i{font-style:normal;color:var(--text-2);font-weight:400}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{background:none;border:0;padding:6px 13px;font:inherit;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.langs button.on{background:var(--brand);color:var(--brand-on)}
main{max-width:820px;margin:0 auto;padding:44px 24px 56px}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.updated{color:var(--text-2);font-size:14px;margin-top:8px}
h2{font-size:17px;font-weight:600;margin:36px 0 12px;color:var(--brand)}
p{margin-bottom:12px}
.tldr{background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:26px 0 6px}
.tldr p{margin:0;font-size:16px}
a{color:var(--brand)}
.cross{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.cross a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;
  text-decoration:none;background:var(--surface)}
footer{border-top:1px solid var(--line);color:var(--text-2);font-size:13px;margin-top:12px}
footer .in{max-width:820px;margin:0 auto;padding:22px 24px;display:flex;flex-wrap:wrap;gap:8px 18px}
[hidden]{display:none!important}
@media (max-width:560px){
  main{padding:30px 20px 48px}
  h1{font-size:25px}
  .bar .in{padding:11px 16px;gap:10px}
  .langs button{padding:5px 9px;font-size:12px}
  .bname i{display:none}
}
/* 只在真的挤不下时才让出品牌名：360px 实测四个语言按钮仍有富余，
   而页面上保留「Reclaim」是审核方确认「这是该 App 的政策页」的依据。 */
@media (max-width:360px){
  .bar .in{padding:11px 12px;gap:6px}
  .bname{display:none}
  .langs button{padding:5px 7px}
}
</style>
</head>
<body>
<div class="bar">
  <div class="in">
    <div class="brand"><span class="mark"></span><span class="bname">Reclaim</span></div>
    <div class="langs">
      <button type="button" data-set="zh" class="on">中文</button>
      <button type="button" data-set="en">English</button>
      <button type="button" data-set="ja">日本語</button>
      <button type="button" data-set="ko">한국어</button>
    </div>
  </div>
</div>
<main>
<section data-doc="zh"><h1>Reclaim</h1><p class="updated">最后更新：2026 年 9 月 22 日</p><div class="cross"><a href="privacy.html">隐私政策</a><a href="terms.html">用户协议</a><a href="support.html">技术支持</a></div></section>

<section data-doc="en"><h1>Reclaim</h1><p class="updated">Last updated: 22 September 2026</p><div class="cross"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="support.html">Support</a></div></section>

<section data-doc="ja"><h1>Reclaim</h1><p class="updated">最終更新：2026年9月22日</p><div class="cross"><a href="privacy.html">プライバシーポリシー</a><a href="terms.html">利用規約</a><a href="support.html">サポート</a></div></section>

<section data-doc="ko"><h1>Reclaim</h1><p class="updated">최종 수정: 2026년 9월 22일</p><div class="cross"><a href="privacy.html">개인정보 처리방침</a><a href="terms.html">이용약관</a><a href="support.html">고객 지원</a></div></section>
</main>
<footer>
  <div class="in">
    <span>Reclaim</span>
    <span>mingzhaoluw@gmail.com</span>
  </div>
</footer>
<script>
(function(){
  var KEY = 'reclaim.legal.lang';
  var LANGS = {
    zh:{html:'zh-CN', title:'Reclaim'},
    en:{html:'en', title:'Reclaim'},
    ja:{html:'ja', title:'Reclaim'},
    ko:{html:'ko', title:'Reclaim'}
  };
  function detect(){
    var n = (navigator.language || 'zh').toLowerCase();
    if (n.indexOf('zh') === 0) return 'zh';
    if (n.indexOf('ja') === 0) return 'ja';
    if (n.indexOf('ko') === 0) return 'ko';
    return 'en';
  }
  function apply(lang){
    if (!LANGS[lang]) lang = 'en';
    document.querySelectorAll('[data-doc]').forEach(function(s){
      s.hidden = s.getAttribute('data-doc') !== lang;
    });
    document.querySelectorAll('.langs button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-set') === lang);
    });
    document.documentElement.lang = LANGS[lang].html;
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply((saved && LANGS[saved]) ? saved : detect());
  document.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click', function(){
      var lang = b.getAttribute('data-set');
      apply(lang);
      try { localStorage.setItem(KEY, lang); } catch(e){}
    });
  });
})();
</script>
</body>
</html>
