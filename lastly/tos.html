<script>
// 极简 Markdown 渲染器（够用就行，不依赖外部库）
function mdToHtml(md) {
  let html = md
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 列表
  html = html.replace(/((?:^- .+\n?)+)/gm, (m) => {
    return '<ul>' + m.replace(/^- (.+)$/gm, '<li>$1</li>') + '</ul>';
  });
  // 段落：按空行分割
  html = html.split(/\n\n+/).map(blk => {
    if (/^<[hu]|<ul/.test(blk)) return blk;
    return '<p>' + blk.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}
</script>

<script>
/* ===== i18n 引擎 ===== */
const LANGS = [
  { code: 'zh-hans', label: '简体',  name: '简体中文' },
  { code: 'zh-hant', label: '繁體',  name: '繁體中文' },

  { code: 'ja',      label: '日本',  name: '日本語' },
  { code: 'ko',      label: '한국',  name: '한국어' },
  { code: 'es',      label: 'ES',    name: 'Español' },
  { code: 'pt-br',   label: 'PT',    name: 'Português' },
  { code: 'fr',      label: 'FR',    name: 'Français' },
  { code: 'de',      label: 'DE',    name: 'Deutsch' },
];

// 公共 UI 文案（页脚链接、按钮等）
const UI_I18N = {
  'zh-hans': { support: '技术支持', tos: '用户协议', privacy: '隐私政策' },
  'zh-hant': { support: '技術支援', tos: '使用者條款', privacy: '隱私權政策' },
  'en':      { support: 'Support', tos: 'Terms', privacy: 'Privacy' },
  'ja':      { support: 'サポート', tos: '利用規約', privacy: 'プライバシー' },
  'ko':      { support: '고객센터', tos: '이용약관', privacy: '개인정보' },
  'es':      { support: 'Soporte', tos: 'Términos', privacy: 'Privacidad' },
  'pt-br':   { support: 'Suporte', tos: 'Termos', privacy: 'Privacidade' },
  'fr':      { support: 'Support', tos: 'Conditions', privacy: 'Confidentialité' },
  'de':      { support: 'Support', tos: 'Bedingungen', privacy: 'Datenschutz' },
};

function detectLang() {
  const saved = localStorage.getItem('Lastly.lang');
  if (saved) return saved;
  const navLang = (navigator.language || 'en').toLowerCase();
  if (navLang.startsWith('zh')) return navLang.includes('tw') || navLang.includes('hk') ? 'zh-hant' : 'zh-hans';
  if (navLang.startsWith('ja')) return 'ja';
  if (navLang.startsWith('ko')) return 'ko';
  if (navLang.startsWith('es')) return 'es';
  if (navLang.startsWith('fr')) return 'fr';
  if (navLang.startsWith('de')) return 'de';
  if (navLang.startsWith('pt')) return 'pt-br';
  return 'en';
}

function renderLangSwitch(current) {
  const bar = document.getElementById('langSwitch');
  bar.innerHTML = '';
  LANGS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (l.code === current ? ' active' : '');
    btn.textContent = l.label;
    btn.title = l.name;
    btn.onclick = () => { localStorage.setItem('Lastly.lang', l.code); location.reload(); };
    bar.appendChild(btn);
  });
}

function applyUI18n(lang) {
  const ui = UI_I18N[lang] || UI_I18N['en'];
  document.getElementById('linkSupport').textContent = ui.support;
  document.getElementById('linkTos').textContent = ui.tos;
  document.getElementById('linkPrivacy').textContent = ui.privacy;
  document.documentElement.lang = lang === 'zh-hans' ? 'zh-Hans' : lang === 'zh-hant' ? 'zh-Hant' : lang;
}
/* ===== END i18n ===== */
</script>
