<style>
  :root {
    --brand: #1A1A1A;
    --brand-light: #555555;
    --brand-dark: #000000;
    --bg: #F8F7FC;
    --card-bg: #FFFFFF;
    --text: #1A1A2E;
    --text-secondary: #6B6B80;
    --border: #ECECF4;
    --radius: 16px;
    --shadow: 0 2px 20px rgba(108, 92, 231, 0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F0F1A;
      --card-bg: #1A1A2E;
      --text: #F0F0FA;
      --text-secondary: #9B9BB0;
      --border: #2A2A3E;
      --shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.8);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  @media (prefers-color-scheme: dark) {
    header { background: rgba(15,15,26,0.8); }
  }
  .nav {
    max-width: 800px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand {
    font-weight: 700;
    font-size: 18px;
    color: var(--brand);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand::before {
    content: '';
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    border-radius: 8px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .lang-btn {
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--brand); color: var(--brand); }
  .lang-btn.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  /* Main */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* Markdown content */
  .doc h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .doc h2 {
    font-size: 22px;
    font-weight: 700;
    margin: 40px 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    color: var(--text);
  }
  .doc h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 24px 0 12px;
    color: var(--text);
  }
  .doc p {
    margin-bottom: 14px;
    color: var(--text);
  }
  .doc ul {
    margin: 12px 0 16px 24px;
  }
  .doc li {
    margin-bottom: 8px;
    color: var(--text);
  }
  .doc strong {
    color: var(--brand);
    font-weight: 600;
  }
  .doc em { color: var(--brand); font-style: normal; }
  .doc a {
    color: var(--brand);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .doc a:hover { border-bottom-color: var(--brand); }

  /* Card wrapper */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 40px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.5s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Support page specific */
  .support-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin: 30px 0;
  }
  .support-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    transition: all 0.3s;
    animation: fadeIn 0.5s ease-out;
  }
  .support-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--brand-light);
  }
  .support-icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .support-card h3 { margin-bottom: 8px; }
  .support-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
  .support-btn {
    display: inline-block;
    padding: 10px 24px;
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .support-btn:hover { transform: scale(1.05); }

  .faq-item {
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    animation: fadeIn 0.5s ease-out;
  }
  .faq-q {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .faq-a {
    color: var(--text-secondary);
    font-size: 15px;
  }

  /* Footer */
  footer {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    border-top: 1px solid var(--border);
  }
  footer a {
    color: var(--brand);
    text-decoration: none;
    margin: 0 10px;
  }
  footer a:hover { text-decoration: underline; }

  /* Mobile */
  @media (max-width: 640px) {
    main { padding: 24px 16px 60px; }
    .card { padding: 24px; border-radius: 12px; }
    .doc h1 { font-size: 26px; }
    .doc h2 { font-size: 19px; margin-top: 32px; }
    .nav { padding: 12px 16px; flex-wrap: wrap; }
    .brand { font-size: 16px; }
    .lang-btn { padding: 5px 8px; font-size: 12px; }
    .support-card { padding: 24px 16px; }
  }
</style>
<script>
// 极简 Markdown 渲染器（够用就行，不依赖外部库）
function mdToHtml(md) {
  let html = md
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 列表
  html = html.replace(/((?:^- .+\n?)+)/gm, (m) => {
    return '<ul>' + m.replace(/^- (.+)$/gm, '<li>$1</li>') + '</ul>';
  });
  // 段落：按空行分割
  html = html.split(/\n\n+/).map(blk => {
    if (/^<[hu]|<ul/.test(blk)) return blk;
    return '<p>' + blk.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}
</script>

<script>
/* ===== i18n 引擎 ===== */
const LANGS = [
  { code: 'zh-hans', label: '简体',  name: '简体中文' },
  { code: 'zh-hant', label: '繁體',  name: '繁體中文' },
  { code: 'en',      label: 'EN',    name: 'English' },
  { code: 'ja',      label: '日本',  name: '日本語' },
  { code: 'ko',      label: '한국',  name: '한국어' },
  { code: 'es',      label: 'ES',    name: 'Español' },
  { code: 'pt-br',   label: 'PT',    name: 'Português' },
  { code: 'fr',      label: 'FR',    name: 'Français' },
  { code: 'de',      label: 'DE',    name: 'Deutsch' },
];

// 公共 UI 文案（页脚链接、按钮等）
const UI_I18N = {
  'zh-hans': { support: '技术支持', tos: '用户协议', privacy: '隐私政策' },
  'zh-hant': { support: '技術支援', tos: '使用者條款', privacy: '隱私權政策' },
  'en':      { support: 'Support', tos: 'Terms', privacy: 'Privacy' },
  'ja':      { support: 'サポート', tos: '利用規約', privacy: 'プライバシー' },
  'ko':      { support: '고객센터', tos: '이용약관', privacy: '개인정보' },
  'es':      { support: 'Soporte', tos: 'Términos', privacy: 'Privacidad' },
  'pt-br':   { support: 'Suporte', tos: 'Termos', privacy: 'Privacidade' },
  'fr':      { support: 'Support', tos: 'Conditions', privacy: 'Confidentialité' },
  'de':      { support: 'Support', tos: 'Bedingungen', privacy: 'Datenschutz' },
};

function detectLang() {
  const saved = localStorage.getItem('Lastly.lang');
  if (saved) return saved;
  const navLang = (navigator.language || 'en').toLowerCase();
  if (navLang.startsWith('zh')) return navLang.includes('tw') || navLang.includes('hk') ? 'zh-hant' : 'zh-hans';
  if (navLang.startsWith('ja')) return 'ja';
  if (navLang.startsWith('ko')) return 'ko';
  if (navLang.startsWith('es')) return 'es';
  if (navLang.startsWith('fr')) return 'fr';
  if (navLang.startsWith('de')) return 'de';
  if (navLang.startsWith('pt')) return 'pt-br';
  return 'en';
}

function renderLangSwitch(current) {
  const bar = document.getElementById('langSwitch');
  bar.innerHTML = '';
  LANGS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (l.code === current ? ' active' : '');
    btn.textContent = l.label;
    btn.title = l.name;
    btn.onclick = () => { localStorage.setItem('Lastly.lang', l.code); location.reload(); };
    bar.appendChild(btn);
  });
}

function applyUI18n(lang) {
  const ui = UI_I18N[lang] || UI_I18N['en'];
  document.getElementById('linkSupport').textContent = ui.support;
  document.getElementById('linkTos').textContent = ui.tos;
  document.getElementById('linkPrivacy').textContent = ui.privacy;
  document.documentElement.lang = lang === 'zh-hans' ? 'zh-Hans' : lang === 'zh-hant' ? 'zh-Hant' : lang;
}
/* ===== END i18n ===== */
</script>
